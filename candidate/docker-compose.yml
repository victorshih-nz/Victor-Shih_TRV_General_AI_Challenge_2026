# Brings up NATS + the simulated exchange, a sample market, and your desk.
#
#   docker compose up                                   # NATS + exchange only
#   docker compose --profile sim up                     # + the sample market
#   docker compose --profile sim --profile strategy up  # + your desk (taker + quoter + hedger)
#
# All services share a private network and reach each other by name.
# Local development defaults to nats://nats:4222. An explicitly supplied
# NATS_URL is propagated consistently to the whole stack.
#
# Use ${VAR-default}, not ${VAR:-default}, for safety-critical configuration:
# an explicitly empty value is preserved so application validation can fail
# closed instead of silently falling back to a local default.

x-desk-env: &desk-env
  NATS_URL: ${NATS_URL-nats://nats:4222}
  SENDER: ${SENDER:-QUOTE001}
  TAKER_SENDER: ${TAKER_SENDER:-PYTKR001}
  HEDGER_SENDER: ${HEDGER_SENDER:-HEDGE001}
  TAKER_FEED: ${TAKER_FEED-AAH6}
  TAKER_RUN: "86400"
  QUOTER_SOFT_POS: ${QUOTER_SOFT_POS-6}
  QUOTER_HARD_POS: ${QUOTER_HARD_POS-12}
  DESK_SOFT_POS: ${DESK_SOFT_POS-6}
  DESK_HARD_POS: ${DESK_HARD_POS-15}

services:
  nats:
    image: nats:latest
    command: ["-js"]
    ports:
      - "4222:4222"

  exchange:
    image: sim-exchange:candidate
    platform: linux/amd64      # prebuilt image; emulated on arm64 (see README)
    environment:
      NATS_URL: ${NATS_URL-nats://nats:4222}
      EX_CONFIG: /instruments.txt
      EX_SHARDS: "1"
    volumes:
      - ./exchange/instruments.txt:/instruments.txt:ro
    depends_on:
      - nats
    restart: on-failure        # retries until NATS is ready

  sim:
    build: ./sim
    environment:
      NATS_URL: ${NATS_URL-nats://nats:4222}
    depends_on:
      - exchange
    restart: on-failure
    profiles:
      - sim

  # ---- the desk: three seats, three senders ------------------------------- #
  # Every seat gets the same feed, NATS URL, sender identities, and desk-risk
  # configuration so private-grader overrides cannot split the desk.
  #
  # The existing taker additionally accepts its original momentum threshold.
  # TAKER_MAX_SPREAD is intentionally absent: the experimental Spread Gate was
  # not shipped.
  taker:
    build: ./taker
    environment:
      <<: *desk-env
      TAKER_THRESH: ${TAKER_THRESH-10}
    depends_on:
      - exchange
    restart: on-failure
    profiles:
      - strategy

  # Your quoter. Put your code + Dockerfile in ./strategy (see TASK.md).
  strategy:
    build: ./strategy
    environment: *desk-env
    depends_on:
      - exchange
    restart: on-failure
    profiles:
      - strategy

  # Your hedger. Put your code + Dockerfile in ./hedger (see TASK.md).
  hedger:
    build: ./hedger
    environment: *desk-env
    depends_on:
      - exchange
    restart: on-failure
    profiles:
      - strategy
